<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style></style>
    <style>
        .header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 20px;
	background: #f8f8f8;
	position: relative;
}

.hamburger {
	display: none;
	background: none;
	border: none;
	font-size: 24px;
	cursor: pointer;
	order: 1;
}

.nav {
	display: flex;
	gap: 20px;
}

.nav a {
	text-decoration: none;
	color: #333;
}
@media (max-width: 768px) {
	.hamburger {
		display: block;
		z-index: 1001;
	}

	.nav {
		position: fixed;
		top: 0;
		right: -100%;
		width: 80%;
		height: 100vh;
		background: #f8f8f8;
		transition: right 0.3s;
		z-index: 1000;
		padding-top: 60px;
		flex-direction: column;
		gap: 15px;
		padding: 60px 20px 20px;
	}

	.nav.active {
		right: 0;
	}

	.nav a {
		padding: 10px;
	}
}
    </style>
</head>
<body>
    <header class="header">
	<nav class="nav">
		<a href="#">Home</a>
		<a href="#">About</a>
		<a href="#">Services</a>
		<a href="#">Contact</a>
	</nav>
	<button class="hamburger">☰</button>
</header>
<script>
    let hamburger = document.querySelector('.hamburger');
let nav = document.querySelector('.nav');

hamburger.addEventListener('click', function(e) {
	e.stopPropagation();
	nav.classList.toggle('active');
});

document.addEventListener('click', function(e) {
	if (!nav.contains(e.target)) {
		nav.classList.remove('active');
	}
});
</script>
</body>

</html>
