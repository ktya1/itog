{% extends 'base.html' %}

{% block styles %}
    <style>
       :root {
        --bg-gradient: linear-gradient(135deg, #2e1e08 0%, #bba987 100%);
        --border: rgba(255, 255, 255, 0.3);
        --text-primary: #f8f9fa;
        --accent: #948363;
        --radius: 14px;
        --transition-speed: 0.3s;
        --font-base: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }


    .conteiner_delete{
        width: 100%;
        max-width: 420px;
        margin: 2rem auto;
        padding: 2.5rem 2rem 2rem;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: apierens 0.5s ease-out;
    }

    @keyframes apierens {
        0% {
            opacity: 0;
            transform: scale(0.95) translateY(20px);
        }
        100% {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }


    .entrance_delete{
        color: var(--color_hover) ;
        width: 20vh;
        height: 10vh;
        background-color: var(--color);
        color: var(--card_background);
        text-decoration: none;
        transition: 0.5s;
        height: 10vh;
        border-radius: 10px;
        font-size: 20px;
    }

    .entrance_delete:hover{
        transform: translateY(-4px);
        background-color: var(--accent);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 1);
    }
    a {
        font-weight: 500;
        font-size: 16px;
        padding: 0.75rem 1.25rem;
        border-radius: var(--radius);
        transition: var(--transition-speed) ease;
        position: relative;
        overflow: hidden;
        text-decoration: none;
        color: var(--text-primary);
    }


    a::after {
        content: '';
        position: absolute;
        bottom: 4px;
        left: 50%;
        width: 0;
        background: var(--accent);
        height: 2px;
        transition: width var(--transition-speed) ease, left var(--transition-speed) ease;
    }

    a:hover::after {
        width: 100%;
        left: 0;
    }

    a:hover {
        color: var(--text-primary);
    }
        
    </style>

{% endblock %}

{% block content %}

    <div class="conteiner_delete">
        <h1>Вы действительно хотите удалить пост?</h1>
        <form method="post" action="{% url 'delete-task' task_id=task.pk %}">
            {% csrf_token %}
            <button type="submit" class="entrance_delete">Удалить</button>
            <a href="{% url 'read-task' task.id %}">назад</a>
        </form>

    </div>

    

{% endblock %}
